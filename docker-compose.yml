services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: patterngard
      POSTGRES_PASSWORD: patterngard
      POSTGRES_DB: patterngard
    volumes:
      - patterngard_pg:/var/lib/postgresql/data

volumes:
  patterngard_pg:
